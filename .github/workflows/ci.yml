name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests
      - name: JSON manifests parse
        run: python -c "import json; [json.load(open(p)) for p in ('.claude-plugin/marketplace.json', 'plugins/project-kit/.claude-plugin/plugin.json')]"
